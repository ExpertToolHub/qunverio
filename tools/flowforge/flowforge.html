<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}

#tb{padding:10px;gap:8px;box-shadow:0 1px 10px #0001}.b{border-radius:10px;padding:9px 12px;font-weight:500;transition:.15s}.b:hover{border-color:var(--ac)}

<script>

const $=s=>document.querySelector(s),svg=$('#s'),G=$('#g'),L=$('#L');
const FONT='system-ui,-apple-system,Segoe UI,Arial,sans-serif',COL=['#ffffff','#dbeafe','#dcfce7','#fef9c3','#fee2e2','#f3e8ff','#ffedd5'];

let S={n:[],e:[]},sel=null,selE=null,mode='sel',conn=null,SN=true,grid=true,view={x:300,y:60,k:1},hist=[],fut=[],drag=null,pinch=0;const P=new Map();
const byId=id=>S.n.find(n=>n.id==id),uid=()=>Math.random().toString(36).slice(2,8);

function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2600)}

if(n.t=='dec')s=`<polygon points="${x},${y-b} ${x+a},${y} ${x},${y+b} ${x-a},${y}" ${st}/>`;
else if(n.t=='io')s=`<polygon points="${x-a+18},${y-b} ${x+a},${y-b} ${x+a-18},${y+b} ${x-a},${y+b}" ${st}/>`;
else if(n.t=='conn')s=`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" ${st}/>`;
else s=`<rect x="${x-a}" y="${y-b}" width="${w}" height="${h}" rx="${n.t=='start'?b:8}" ${st}/>`;
const T=wrap(n.s,Math.max(4,Math.floor((w-(n.t=='dec'?76:34))/7.6)));

function bd(n,tx,ty){const dx=tx-n.x,dy=ty-n.y,a=n.w/2,b=n.h/2;if(!dx&&!dy)return{x:n.x,y:n.y};let t;

function edgeSVG(e,sl,hit){const a=byId(e.a),b=byId(e.b);if(!a||!b)return'';const p=bd(a,b.x,b.y),q=bd(b,a.x,a.y),c=sl?'#4f46e5':'#475569';
let s=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${c}" stroke-width="2" marker-end="url(#${sl?'ars':'ar'})"/>`;
if(hit)s+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="transparent" stroke-width="18"/>`;
if(e.l){const mx=(p.x+q.x)/2,my=(p.y+q.y)/2,tw=e.l.length*7.4+10;s+=`<rect x="${mx-tw/2}" y="${my-10}" width="${tw}" height="20" rx="4" fill="#fff" stroke="${c}"/><text x="${mx}" y="${my+4.5}" text-anchor="middle" font-size="13" fill="#111827" font-family="${FONT}">${esc(e.l)}</text>`}return s}
const DEFS=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker></defs>`;
function render(){G.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`);$('#gr').style.display=grid?'':'none';
L.innerHTML=DEFS+S.e.map(e=>`<g data-e="${e.id}">${edgeSVG(e,e.id==selE,1)}</g>`).join('')+S.n.map(n=>`<g data-id="${n.id}" style="cursor:move">${nodeSVG(n,n.id==sel||MS.has(n.id))}</g>`).join('');
$('#cn').classList.toggle('on',mode=='conn');$('#gd').classList.toggle('on',grid);save()}
function props(){const p=$('#pr');p.innerHTML='';const mk=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const btn=(t,f)=>{const b=mk(`<button class="b">${t}</button>`);b.onclick=f;p.appendChild(b);return b};
if(mode=='conn'){p.innerHTML=`<span class="mu">${conn?'Now tap the target shape':'Tap the source shape, then the target shape'}</span>`;return}
const n=byId(sel),e=S.e.find(x=>x.id==selE);
if(n){const i=mk(`<input type="text" placeholder="Shape text" value="${esc(n.s)}">`);i.onfocus=H;i.oninput=()=>{n.s=i.value;render()};p.appendChild(i);
COL.forEach(c=>{const s=mk(`<button class="sw" style="background:${c}"></button>`);s.onclick=()=>{H();n.c=c;render()};p.appendChild(s)});
btn('Connect',()=>{mode='conn';conn=n.id;render();props()});btn('Copy',()=>{H();const m={...n,id:uid(),x:n.x+30,y:n.y+30};S.n.push(m);sel=m.id;render();props()});
btn('A−',()=>{H();n.w*=.9;n.h*=.9;render()});btn('A+',()=>{H();n.w*=1.1;n.h*=1.1;render()});btn('🗑',del)}
else if(e){const i=mk(`<input type="text" placeholder="Arrow label (Yes / No)" value="${esc(e.l||'')}">`);i.onfocus=H;i.oninput=()=>{e.l=i.value;render()};p.appendChild(i);
btn('⇄ Reverse',()=>{H();[e.a,e.b]=[e.b,e.a];render()});btn('🗑',del)}
else p.innerHTML='<span class="mu">Add shapes from the top bar. Tap a shape to edit. Use Connect to link two shapes. Drag empty space to pan, pinch or scroll to zoom.</span>'}
function del(){H();if(sel){S.e=S.e.filter(e=>e.a!=sel&&e.b!=sel);S.n=S.n.filter(n=>n.id!=sel)}else if(selE)S.e=S.e.filter(e=>e.id!=selE);sel=selE=null;render();props()}
function sn(v){return SN?Math.round(v/20)*20:v}
function toW(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left-view.x)/view.k,y:(e.clientY-r.top-view.y)/view.k}}
function zoomAt(cx,cy,f){const k0=view.k,k=Math.min(3,Math.max(.2,k0*f)),wx=(cx-view.x)/k0,wy=(cy-view.y)/k0;view.k=k;view.x=cx-wx*k;view.y=cy-wy*k}
function addNode(t){H();const r=svg.getBoundingClientRect(),c=toW({clientX:r.left+r.width/2,clientY:r.top+r.height/2}),d=DEF[t],j=S.n.length%5*20;
const n={id:uid(),t,x:sn(c.x+j),y:sn(c.y+j),w:d[0],h:d[1],s:d[2],c:'#ffffff'};S.n.push(n);sel=n.id;selE=null;render();props()}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addNode(b.dataset.add));
$('#cn').onclick=()=>{mode=mode=='conn'?'sel':'conn';conn=mode=='conn'&&sel?sel:null;render();props()};
function undo(){if(!hist.length)return;fut.push(JSON.stringify(S));S=JSON.parse(hist.pop());sel=selE=null;render();props()}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(S));S=JSON.parse(fut.pop());sel=selE=null;render();props()}
$('#un').onclick=undo;$('#re').onclick=redo;$('#gd').onclick=()=>{grid=!grid;render()};
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
function bounds(){if(!S.n.length)return null;let a=1e9,b=1e9,c=-1e9,d=-1e9;S.n.forEach(n=>{a=Math.min(a,n.x-n.w/2);b=Math.min(b,n.y-n.h/2);c=Math.max(c,n.x+n.w/2);d=Math.max(d,n.y+n.h/2)});return{x:a-40,y:b-40,w:c-a+80,h:d-b+80}}
function fit(){const b=bounds(),r=svg.getBoundingClientRect();if(!b){view={x:r.width/2,y:80,k:1};render();return}const k=Math.min(1.5,r.width/b.w,r.height/b.h);view.k=k;view.x=(r.width-b.w*k)/2-b.x*k;view.y=(r.height-b.h*k)/2-b.y*k;render()}
$('#fit').onclick=fit;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});$('#ex').classList.remove('o');
if(P.size==2){drag=null;const[a,b]=[...P.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);return}
const g=e.target.closest('[data-id]'),ed=e.target.closest('[data-e]'),w=toW(e);
if(g){const n=byId(g.dataset.id);if((e.shiftKey||MM)&&mode!='conn'){if(sel)MS.add(sel);if(MS.has(n.id))MS.delete(n.id);else MS.add(n.id);sel=selE=null;if(MS.size==1){sel=[...MS][0];MS.clear()}render();props();return}if(!MS.has(n.id))MS.clear();
if(mode=='conn'){if(!conn||conn==n.id){conn=n.id;sel=n.id}else{H();const x={id:uid(),a:conn,b:n.id,l:''};S.e.push(x);conn=null;mode='sel';sel=null;selE=x.id}selE=mode=='conn'?null:selE;render();props();return}
sel=MS.has(n.id)?null:n.id;selE=null;drag={n,dx:w.x-n.x,dy:w.y-n.y,m:0}}
else if(ed&&mode!='conn'){selE=ed.dataset.e;sel=null}
else{if(mode!='conn'){sel=selE=null;if(!MM)MS.clear()}drag={pan:1,sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y}}
render();props()});
svg.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(P.size==2){const[a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=svg.getBoundingClientRect();if(pinch)zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pinch);pinch=d;render();return}
if(!drag)return;if(drag.pan){view.x=drag.vx+e.clientX-drag.sx;view.y=drag.vy+e.clientY-drag.sy}
else{const w=toW(e);if(!drag.m){H();drag.m=1}const nx=sn(w.x-drag.dx),ny=sn(w.y-drag.dy),ox=drag.n.x,oy=drag.n.y;drag.n.x=nx;drag.n.y=ny;if(MS.has(drag.n.id))S.n.forEach(m=>{if(m!==drag.n&&MS.has(m.id)){m.x+=nx-ox;m.y+=ny-oy}})}render()});
const up=e=>{P.delete(e.pointerId);pinch=0;if(!P.size)drag=null};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.1:.91);render()},{passive:false});
svg.addEventListener('dblclick',e=>{const i=$('#pr input');if(i&&sel)i.focus()});
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if((e.key=='Delete'||e.key=='Backspace')&&(sel||selE))del();
if((e.ctrlKey||e.metaKey)&&e.key=='z'){e.preventDefault();e.shiftKey?redo():undo()}if((e.ctrlKey||e.metaKey)&&e.key=='y')redo()});
/* v2: more shapes, styles, edge types, auto layout */
Object.assign(DEF,{db:[120,90,'Database'],doc:[150,80,'Document'],pre:[170,70,'Subprocess'],dly:[150,70,'Delay'],hex:[170,76,'Prepare'],tri:[110,100,''],pen:[110,100,''],star:[120,120,''],trp:[170,70,'Manual op'],man:[170,70,'Manual input'],arr:[160,80,'Next'],crs:[100,100,''],txt:[160,40,'Text'],cir:[90,90,''],nte:[160,90,'Note']});
const PL={dec:[[0,-1],[1,0],[0,1],[-1,0]],io:[[-.8,-1],[1,-1],[.8,1],[-1,1]],hex:[[-1,0],[-.6,-1],[.6,-1],[1,0],[.6,1],[-.6,1]],tri:[[0,-1],[1,1],[-1,1]],trp:[[-.7,-1],[.7,-1],[1,1],[-1,1]],man:[[-1,-.5],[1,-1],[1,1],[-1,1]],arr:[[-1,-.45],[.2,-.45],[.2,-1],[1,0],[.2,1],[.2,.45],[-1,.45]],crs:[[-.35,-1],[.35,-1],[.35,-.35],[1,-.35],[1,.35],[.35,.35],[.35,1],[-.35,1],[-.35,.35],[-1,.35],[-1,-.35],[-.35,-.35]],nte:[[-1,-1],[.7,-1],[1,-.6],[1,1],[-1,1]]};
PL.star=[...Array(10)].map((_,i)=>{const r=i%2?.42:1,a=-Math.PI/2+i*Math.PI/5;return[r*Math.cos(a),r*Math.sin(a)]});PL.pen=[...Array(5)].map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[Math.cos(a),Math.sin(a)]});
function rayPoly(n,dx,dy){const q=PL[n.t].map(p=>[n.x+p[0]*n.w/2,n.y+p[1]*n.h/2]);let best=1e9;for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length],ex=b[0]-a[0],ey=b[1]-a[1],d=dx*ey-dy*ex;if(!d)continue;const t=((a[0]-n.x)*ey-(a[1]-n.y)*ex)/d,u=((a[0]-n.x)*dy-(a[1]-n.y)*dx)/d;if(t>0&&u>=0&&u<=1&&t<best)best=t}return best}
function bd(n,tx,ty){const dx=tx-n.x,dy=ty-n.y,a=n.w/2,b=n.h/2;if(!dx&&!dy)return{x:n.x,y:n.y};let t;if(PL[n.t]){t=rayPoly(n,dx,dy);if(t>1e8)t=.5}else if(n.t=='conn'||n.t=='cir')t=1/Math.hypot(dx/a,dy/b);else t=Math.min(a/Math.abs(dx||1e-9),b/Math.abs(dy||1e-9));return{x:n.x+dx*t,y:n.y+dy*t}}
function shp(n,st){const{x,y,w,h,t}=n,a=w/2,b=h/2,k=n.k||'#334155';
