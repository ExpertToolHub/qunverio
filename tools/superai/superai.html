$('cvd').onclick=()=>{const x={html:'html',js:'js',javascript:'js',python:'py',py:'py',css:'css',json:'json',md:'md',markdown:'md'}[cvL]||'txt',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('cvv').value]));a.download='canvas.'+x;a.click()};
$('cvs2').onclick=()=>{const i=$('cvi').value.trim();if(!i||busy)return;$('q').value=`${i}\n\n\`\`\`${cvL}\n${$('cvv').value}\n\`\`\``;$('cvi').value='';$('cvs').hidden=true;send()};
$('cvi').onkeydown=e=>{if(e.key==='Enter')$('cvs2').click()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('mc2').onclick=()=>{
 if(!SR)return note('Is browser me voice input support nahi hai (Chrome use karo)');
 if(rec){rec.stop();return}
 rec=new SR();rec.lang=ls('vl')||'hi-IN';rec.interimResults=true;rec.continuous=true;
 const base=$('q').value;let fin='';
 rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else it+=t}$('q').value=(base?base+' ':'')+fin+it;grow()};
 rec.onend=()=>{rec=null;$('mc2').classList.remove('rec')};
 rec.onerror=e=>{if(e.error==='not-allowed')note('Mic ki permission do (browser settings me)')};
 rec.start();$('mc2').classList.add('rec')};
$('mc2').oncontextmenu=e=>{e.preventDefault();const l=(ls('vl')||'hi-IN')==='hi-IN'?'en-IN':'hi-IN';ls('vl',l);note('Voice language: '+(l==='hi-IN'?'Hindi/Hinglish':'English'))};
lbl();renderAll();ensure();

</script>
