<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qunverio SkillTrack Pro</title>
<!-- Qunverio SkillTrack Pro — standalone local-first training & knowledge tracker.
     External (optional) CDN libraries, loaded lazily only when needed: jsPDF + jsPDF-AutoTable (PDF reports), SheetJS (XLSX export).
     No analytics, no uploads, no API keys. All data stays in this browser (IndexedDB). -->
<style>
:root{--bg:#0e1218;--panel:#161b23;--panel2:#1c222c;--border:#283040;--text:#e7ebf1;--muted:#8d97a8;--accent:#4c9aff;--accent-t:#14263d;--ok:#2fbf7a;--warn:#f0a43a;--danger:#ee5a5a;--info:#7c8cff;--shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);--canvas:#10151c;--grid:#1a212b;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[data-theme=light]{--bg:#f2f4f8;--panel:#fff;--panel2:#f6f8fb;--border:#d9dfe8;--text:#18202c;--muted:#5d6879;--accent:#1f6feb;--accent-t:#e6f0ff;--shadow:0 1px 2px rgba(20,30,50,.08),0 6px 18px rgba(20,30,50,.07);--canvas:#fbfcfe;--grid:#e8ecf2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.25}h1{font-size:22px}h2{font-size:18px}h3{font-size:16px}h4{font-size:14px}
.app{display:flex;min-height:100vh}
#sidebar{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .15s;z-index:30}
.collapsed #sidebar{width:62px}
.brand{display:flex;gap:10px;align-items:center;padding:14px 14px 10px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#2fbf7a);display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.bt b{display:block;font-size:14px}.bt small{color:var(--muted);font-size:11px}
.nav{padding:6px 0;flex:1}
.nav a{display:flex;gap:11px;align-items:center;padding:9px 13px;margin:2px 8px;border-radius:8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.nav a:hover{background:var(--panel2);text-decoration:none;color:var(--text)}
.nav a.on{background:var(--accent-t);color:var(--accent);font-weight:600}
.collapsed .nav a .l,.collapsed .bt{display:none}
.sbfoot{padding:10px 14px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
.collapsed .sbfoot{display:none}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.gs{flex:1;max-width:520px;position:relative}
.gs input{width:100%;padding-left:34px}
.gs .ic{position:absolute;left:10px;top:9px;color:var(--muted)}
#gres{position:absolute;top:40px;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;z-index:50}
#gres a{display:block;padding:8px 12px;color:var(--text);border-bottom:1px solid var(--border)}#gres a:hover{background:var(--panel2);text-decoration:none}
#gres small{color:var(--muted)}
#view{padding:18px 20px 70px;max-width:1500px;width:100%}
.scrim{display:none}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;min-width:0}
.card h3{display:flex;align-items:center;gap:8px;justify-content:space-between}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0}
.stat b{display:block;font-size:24px;line-height:1.1}.stat span{color:var(--muted);font-size:12px}
.stat.w b{color:var(--warn)}.stat.d b{color:var(--danger)}.stat.o b{color:var(--ok)}
.pagehead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.pagehead p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:34px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:3px 8px;min-height:28px;font-size:12px}.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--panel2)}
.ib{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:inline-grid;place-items:center;position:relative}
.ib:hover{background:var(--panel2);color:var(--text)}
.dot{position:absolute;top:0;right:0;background:var(--danger);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;min-width:16px;text-align:center}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-height:34px;max-width:100%;width:100%}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters>*{width:auto;flex:1 1 140px;max-width:240px}.filters .btn{flex:none}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.info{color:var(--info);border-color:var(--info)}.badge.warn{color:var(--warn);border-color:var(--warn)}.badge.danger{color:var(--danger);border-color:var(--danger)}.badge.sample{background:var(--warn);color:#111;border-color:var(--warn)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:hover td{background:var(--panel2)}
.pb{height:8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;overflow:hidden;min-width:60px}.pb i{display:block;height:100%;background:var(--ok)}
.pbl{display:flex;gap:8px;align-items:center}.pbl span{font-size:12px;color:var(--muted);min-width:36px;text-align:right}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--border);border-radius:12px}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.muted{color:var(--muted)}.small{font-size:12px}.mt{margin-top:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:8px 13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}.tabs a.on{color:var(--accent);border-color:var(--accent);font-weight:600}.tabs a:hover{text-decoration:none;color:var(--text)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto;z-index:100}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:560px;max-width:100%;box-shadow:var(--shadow)}.modal.wide{width:820px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}.mh h3{margin:0}
.mb{padding:14px 16px}.mf{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
.modal>h3{padding:14px 16px 0}.ferr{color:var(--danger);margin-right:auto;font-size:12px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}.fg .full{grid-column:1/-1}
.fg label.l{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.fsec{grid-column:1/-1;margin:10px 0 0;padding-top:8px;border-top:1px solid var(--border);color:var(--accent)}
.fg .help{font-size:11px;color:var(--muted)}.rq{color:var(--danger)}.invalid{border-color:var(--danger)!important}
.chk{display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:140px;overflow:auto;padding:6px;border:1px solid var(--border);border-radius:8px;background:var(--panel2)}
.chips label{display:flex;gap:5px;align-items:center;border:1px solid var(--border);padding:2px 8px;border-radius:16px;font-size:12px}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:calc(100vw - 28px)}
.toast{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--ok);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);animation:in .2s}.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warn)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px}.kv dt{color:var(--muted)}.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.pre{white-space:pre-wrap;word-break:break-word}
.banner{padding:9px 12px;border-radius:8px;border:1px solid var(--warn);background:rgba(240,164,58,.1);margin-bottom:12px;font-size:13px}
.banner.info{border-color:var(--accent);background:var(--accent-t)}.banner.danger{border-color:var(--danger);background:rgba(238,90,90,.1)}
.hbar{display:grid;grid-template-columns:minmax(80px,30%) 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{border-left:2px solid var(--border);margin-left:6px;padding-left:14px}.tl>div{position:relative;margin-bottom:10px}.tl>div:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.chart svg{width:100%;height:auto;display:block}
.note-body h3,.note-body h4{margin:10px 0 4px}.note-body ul{margin:4px 0;padding-left:20px}.note-body p{margin:4px 0}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;background:var(--panel2);border:1px solid var(--border)}
.cell.ok{background:rgba(47,191,122,.2);border-color:var(--ok)}.cell.mid{background:rgba(124,140,255,.2);border-color:var(--info)}.cell.warn{background:rgba(240,164,58,.2);border-color:var(--warn)}
/* flow editor */
.fe{display:grid;grid-template-columns:1fr 310px;gap:10px;height:calc(100vh - 210px);min-height:460px}
.fe-main{display:flex;flex-direction:column;min-width:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--canvas)}
.fe-tools{display:flex;gap:4px;flex-wrap:wrap;padding:6px;background:var(--panel);border-bottom:1px solid var(--border)}
.fe-tools .btn{padding:3px 8px;min-height:30px;font-size:12px}.fe-tools .sep{width:1px;background:var(--border);margin:2px 4px}
#fcanvas{flex:1;min-height:0;position:relative;touch-action:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#fsvg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.fe-side{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:12px;min-width:0}
.fe-side label.l{display:block;font-size:11px;color:var(--muted);margin:8px 0 2px}
.sw{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);cursor:pointer;margin-right:4px}
.fstatus{font-size:12px;color:var(--muted)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){
 #sidebar{position:fixed;left:-260px;width:240px;transition:left .2s;box-shadow:var(--shadow)}.collapsed #sidebar{width:240px}.collapsed .nav a .l,.collapsed .bt,.collapsed .sbfoot{display:revert}
 .navopen #sidebar{left:0}.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
 #view{padding:12px 10px 80px}.g2,.g3,.g4{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.fg{grid-template-columns:1fr}
 .hide-m{display:none!important}.filters>*{max-width:none;flex:1 1 45%}
 .tbl thead{display:none}.tbl tr{display:block;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;padding:6px 10px;background:var(--panel)}.tbl td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0;text-align:right}.tbl td::before{content:attr(data-label);color:var(--muted);flex:none;text-align:left}.tbl td[data-label=""]::before{display:none}.tbl td:first-child{font-weight:600}
 .kv{grid-template-columns:1fr}.hbar{grid-template-columns:90px 1fr 40px}
 .fe{grid-template-columns:1fr;height:auto}.fe-main{height:62vh}.fe-side{max-height:none}
 .gs{max-width:none}
}
@media print{#sidebar,.topbar,.btn,.scrim,#toasts{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside id="sidebar" aria-label="Main navigation"></aside>
  <div class="scrim" data-act="navClose"></div>
  <div class="main-col">
    <header class="topbar">
      <button class="ib" data-act="navToggle" aria-label="Toggle navigation" id="navBtn"></button>
      <div class="gs"><span id="gsic"></span><input id="gsearch" type="search" placeholder="Search equipment, topics, tasks, flows, notes…  ( / )" autocomplete="off"><div id="gres"></div></div>
      <span class="sp"></span>
      <button class="btn primary" data-act="quickAdd" id="qaBtn"></button>
      <button class="ib" data-act="bell" title="Due items" id="bellBtn"></button>
      <button class="ib" data-act="theme" title="Toggle theme" id="themeBtn"></button>
      <a class="ib" href="#/settings" title="Settings" id="setBtn"></a>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:20px">SkillTrack Pro needs JavaScript enabled.</p></noscript>
<script>
'use strict';
/* ============================================================
   1. CONSTANTS, UTILITIES
   ============================================================ */
const APP={name:'Qunverio SkillTrack Pro',tag:'Learn. Track. Master. Improve.',schema:1,db:'qunverio_skilltrack_pro'};
const STORES=['equipment','categories','topics','tasks','flows','sessions','skills','revisions','notes','questions','attempts','activity'];
const BACKUP_STORES=STORES.filter(s=>s!=='activity');
const STATUS=['Not Started','In Progress','Completed','Needs Revision','On Hold'];
const TASK_STATUS=['Not Started','In Progress','Completed','On Hold'];
const PRIO=['Low','Medium','High','Critical'];
const SKILL_STATUS=['Not Started','Learning','Needs Practice','Assessment Pending','Verified','Needs Refresher'];
const METHODS=['Classroom','Demonstration','Supervised Practice','Self-Study','Assessment','Refresher Training','Other'];
const DEF_SKILL_CATS=['Equipment Knowledge','Process Understanding','Quality Knowledge','Safety Knowledge','Technical Documentation','Troubleshooting Knowledge','Practical Skills'];
const REV_TYPES=['Review','Recall test','Practical walkthrough','Quiz','Discussion'];
const REVTYPE={equipment:'equipment',topic:'topics',flow:'flows',skill:'skills'};
const LOGS={equipment:'equipment',topics:'topic',tasks:'task',flows:'process flow',sessions:'training session',skills:'skill',notes:'note',questions:'question',revisions:'revision'};
const REFS={
 equipment:[['topics','equipmentId'],['flows','equipmentId'],['sessions','equipmentId'],['skills','equipmentId'],['questions','equipmentId'],['attempts','equipmentId'],['notes','equipmentIds',1]],
 topics:[['flows','topicId'],['sessions','topicId'],['questions','topicId'],['attempts','topicId'],['notes','topicIds',1],['topics','prereqs',1],['skills','topicIds',1]],
 flows:[['notes','flowIds',1]],skills:[],notes:[],sessions:[],questions:[]};
const S={};STORES.forEach(s=>S[s]=[]);
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const nowISO=()=>new Date().toISOString();
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const addDays=(s,n)=>{const d=pd(s)||new Date();d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s){const d=pd(s);if(!d)return s?String(s).slice(0,10):'—';const f=Pref.get('dateFmt');const Y=d.getFullYear(),M=pad(d.getMonth()+1),Dd=pad(d.getDate());
 return f==='YYYY-MM-DD'?`${Y}-${M}-${Dd}`:f==='DD/MM/YYYY'?`${Dd}/${M}/${Y}`:f==='MM/DD/YYYY'?`${M}/${Dd}/${Y}`:`${Dd} ${MON[d.getMonth()]} ${Y}`;}
const fmtTs=s=>{if(!s)return '—';const d=new Date(s);return isNaN(d)?'—':fmtDate(ymd(d))+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const splitTags=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const lines=s=>String(s||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
const clone=o=>JSON.parse(JSON.stringify(o));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const sortBy=(arr,k,dir=1)=>arr.slice().sort((a,b)=>String(a[k]||'').localeCompare(String(b[k]||''),undefined,{numeric:true})*dir);
const uniq=a=>[...new Set(a.filter(Boolean))];
const has=(h,q)=>String(h||'').toLowerCase().includes(String(q||'').toLowerCase());
function download(name,data,mime){const b=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},1500)}

const Rev={
 /* never creates a duplicate scheduled revision for the same target+date; only runs on user actions, never on page load */
 async schedule(type,id,date,note,extra){if(!date||!pd(date))return null;if(S.revisions.some(r=>r.status==='scheduled'&&r.targetType===type&&r.targetId===id&&r.dueDate===date))return null;
  return D.save('revisions',{targetType:type,targetId:id,targetName:D.nameOf(type,id),dueDate:date,status:'scheduled',type:'Review',notes:note||'',...(extra||{})})},
 targetOpts(){return[...S.equipment.map(e=>['equipment:'+e.id,'Equipment: '+e.name]),...S.topics.map(e=>['topic:'+e.id,'Topic: '+e.title]),...S.flows.map(e=>['flow:'+e.id,'Process: '+e.title]),...S.skills.map(e=>['skill:'+e.id,'Skill: '+e.name])]},
 intervalOpts(){return[['custom','Custom date'],...Pref.get('intervals').map(n=>[String(n),n+' day'+(n>1?'s':'')+' from today'])]},
 weak(){const m=[];S.topics.forEach(t=>{const c=S.revisions.filter(r=>r.targetType==='topic'&&r.targetId===t.id&&r.status==='completed').sort((a,b)=>(a.completedDate||'')<(b.completedDate||'')?1:-1);
  const reasons=[];if(t.confidence&&t.confidence<=2)reasons.push('self-rated confidence '+t.confidence+'/5');if(c[0]&&c[0].confAfter&&c[0].confAfter<=2)reasons.push('last revision confidence '+c[0].confAfter+'/5');if(t.status==='Needs Revision')reasons.push('marked Needs Revision');if(reasons.length)m.push({t,reasons})});return m},
 repeated(){const m={};S.revisions.filter(r=>r.status==='completed'&&r.confAfter&&r.confAfter<=2).forEach(r=>{const k=r.targetType+':'+r.targetId;(m[k]=m[k]||{r,n:0}).n++});return Object.values(m).filter(x=>x.n>=2)}};

 const v=Backup.validate(o);if(v.errs.length||!v.clean)return Modal.open(`<div class="mh"><h3>Restore rejected</h3></div><div class="mb"><ul>${v.errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><p><b>Your existing data was not changed.</b></p></div><div class="mf"><button class="btn" onclick="Modal.close()">Close</button></div>`);
 const rows=BACKUP_STORES.map(s=>{const inc=v.clean[s];const exist=inc.filter(r=>D.get(s,r.id)).length;return[s,inc.length,inc.length-exist,exist,v.skipped[s]||0]});const total=rows.reduce((a,r)=>a+r[1],0);
 const d=Modal.open(`<div class="mh"><h3>Restore preview</h3><button class="ib" data-m="x">${ic('x')}</button></div><div class="mb"><p>Backup from <b>${fmtTs(o.exportedAt)}</b> (schema v${o.schemaVersion}) — ${total} valid record(s).</p>${tbl(['Store','Valid records','New','Already exist','Rejected (malformed)'],rows)}
 <div class="banner mt"><b>Merge</b> adds new records and, for records with the same ID, keeps whichever was updated most recently. Nothing is deleted.<br><b>Replace</b> deletes ALL current data and replaces it with the backup. This cannot be undone.</div><p class="small muted">Tip: download a backup of the current data first.</p></div><div class="mf"><button class="btn" data-m="cur">Download current data first</button><button class="btn" data-m="x">Cancel</button><button class="btn primary" data-m="merge">Import & merge</button><button class="btn danger" data-m="replace">Replace all data…</button></div>`,{cls:'wide'});
 d.addEventListener('click',async e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;if(m==='x')return Modal.close(d);if(m==='cur')return ACT.backupDownload();
  if(m==='replace'&&!await confirmDlg('<p>This will <b>permanently delete all current data</b> and replace it with the backup.</p><p>Type <b>REPLACE</b> to confirm.</p><input id="cfType" placeholder="REPLACE">',{title:'Replace all local data?',danger:true,ok:'Replace everything',type:'REPLACE'}))return;
  try{const ops=[];
   if(m==='replace'){BACKUP_STORES.forEach(s=>{ops.push({op:'clear',store:s});v.clean[s].forEach(r=>ops.push({op:'put',store:s,rec:r}))})}
   else BACKUP_STORES.forEach(s=>v.clean[s].forEach(r=>{const cur=D.get(s,r.id);if(!cur||String(r.updated||'')>String(cur.updated||''))ops.push({op:'put',store:s,rec:r})}));
   await D.tx(ops);if(m==='replace'&&o.prefs&&typeof o.prefs==='object')Pref.setAll(o.prefs);D.log((m==='replace'?'Replaced all data from backup':'Merged backup')+' ('+total+' records)','backup','');Modal.close(d);buildShell();toast(m==='replace'?'Data replaced from backup':'Backup merged ('+ops.length+' records written)');render()}
  catch(err){console.error(err);toast('Restore failed — existing data left intact: '+err.message,'err')}})};
V.backup=()=>{const last=Pref.get('lastBackup');const counts=BACKUP_STORES.map(s=>[s,S[s].length]);
 return`<div class="pagehead"><div><h1>Backup & Restore</h1><p>Your data lives only in this browser.</p></div></div>
 <div class="banner danger"><b>You are responsible for your backups.</b> Browser storage (IndexedDB) is <u>not</u> a secure or enterprise database: clearing site data, using a private window, uninstalling the browser or a device reset can erase everything. Export a JSON backup regularly and store it safely. Do not store confidential company data you are not authorised to keep personally.</div>
 ${DB.mem?'<div class="banner danger">IndexedDB is unavailable — data is held in memory only and will be lost on close.</div>':''}
 <div class="grid g2"><div class="card"><h3>Export backup</h3><p>Complete JSON backup of equipment, categories, topics, tasks, process flows (with nodes and connectors), sessions, skills, revisions, notes, questions, assessment history and preferences, with schema version and timestamp.</p><p class="small muted">Last backup downloaded: <b>${last?fmtTs(last):'never'}</b></p>${btn('backupDownload','Download JSON backup',{icon:'download',cls:'primary'})}</div>
 <div class="card"><h3>Restore from backup</h3><p>Choose a backup file. You'll see a validation preview first and can choose to <b>merge</b> or <b>replace</b>. Malformed records are rejected; malformed files change nothing.</p><input type="file" id="restoreFile" accept=".json,application/json" data-chg="restoreFile"></div></div>
 <div class="card"><h3>Stored records</h3>${tbl(['Store','Records'],counts)}</div>`};

  const t3=put('topics',mk('top',{title:'Sample: Process understanding',category:'Process Understanding',equipmentId:e1.id,status:'Not Started',priority:'Medium',importance:'Medium',targetDate:addDays(T,-2),progressMode:'tasks',prereqs:[t2.id]}));

  const mkn=(type,x,y,title,extra)=>({id:uid('n'),type,x,y,w:NT[type].w,h:NT[type].h,title,desc:'',purpose:'',checks:'',expected:'',safety:'',quality:'',ref:'',notes:'',equipmentId:'',topicId:'',color:'',...extra});
  const n=[mkn('start',260,20,'Start'),mkn('input',250,110,'Receive item'),mkn('process',250,210,'Prepare item'),mkn('decision',245,310,'Ready?'),mkn('process',560,330,'Adjust'),mkn('inspect',245,450,'Check item',{desc:'EXAMPLE ONLY'}),mkn('decision',245,570,'Pass?'),mkn('output',250,700,'Release item'),mkn('end',260,800,'End'),mkn('process',560,590,'Rework')];
  const E=(a,b,l)=>({id:uid('e'),from:n[a].id,to:n[b].id,label:l||''});
  put('flows',mk('flo',{title:'Sample: Generic item flow',description:'Illustrative flow only — not a real procedure.',category:'Process',equipmentId:e1.id,topicId:t3.id,version:'1',status:'Draft',nodes:n,edges:[E(0,1),E(1,2),E(2,3),E(3,5,'Yes'),E(3,4,'No'),E(4,2),E(5,6),E(6,7,'Pass'),E(6,9,'Fail'),E(9,5),E(7,8)]}));
  put('sessions',mk('ses',{title:'Sample: Orientation walk-through',equipmentId:e1.id,topicId:t1.id,date:addDays(T,-8),durationMin:45,method:'Demonstration',theory:'Completed',practical:'Observed only',covered:'Overview of layout and components',score:80}));
  put('sessions',mk('ses',{title:'Sample: Self-study — principle',equipmentId:e1.id,topicId:t2.id,date:addDays(T,-2),durationMin:60,method:'Self-Study',theory:'Partially',practical:'Not applicable',doubts:'Example doubt'}));
  put('skills',mk('skl',{name:'Sample: Identify equipment components',category:'Equipment Knowledge',equipmentId:e1.id,topicIds:[t1.id],confidence:4,status:'Verified',theory:'Completed',practical:'Completed',assessment:'Passed',verification:'Verified',officialAuth:'Not recorded'}));
  put('skills',mk('skl',{name:'Sample: Explain basic inspection steps',category:'Quality Knowledge',equipmentId:e2.id,topicIds:[t4.id],confidence:2,status:'Learning',theory:'In Progress',practical:'Completed',assessment:'Not Assessed',verification:'Not Verified',officialAuth:'Not recorded'}));
  put('revisions',mk('rev',{targetType:'topic',targetId:t1.id,targetName:t1.title,dueDate:addDays(T,1),status:'scheduled',type:'Review',notes:''}));
  put('revisions',mk('rev',{targetType:'topic',targetId:t1.id,targetName:t1.title,dueDate:addDays(T,-4),status:'completed',completedDate:addDays(T,-4),type:'Review',confBefore:2,confAfter:4,notes:'Sample revision'}));
  put('notes',mk('not',{title:'Sample: Study note',content:'# Sample note\n- This is **example** content\n- Replace it with your own notes\n[Example link](https://example.com)',category:'General',equipmentIds:[e1.id],topicIds:[t2.id],flowIds:[],tags:['sample'],fav:true,pinned:true}));
  put('questions',mk('que',{type:'mcq',text:'Sample: Which item is a listed component of the sample conveyor?',options:['Belt','Rocket','Sail'],answer:'Belt',explanation:'Example only.',topicId:t1.id,equipmentId:e1.id}));
  put('questions',mk('que',{type:'tf',text:'Sample: Completing a quiz grants official authorisation.',options:[],answer:'False',explanation:'Assessment scores never imply authorisation.',topicId:t1.id,equipmentId:e1.id}));
  put('questions',mk('que',{type:'short',text:'Sample: Name one main component (type: frame)',options:[],answer:'frame|drive unit|belt|control panel',explanation:'',topicId:t1.id,equipmentId:e1.id}));
  await D.tx(ops);D.log('Loaded sample data','sample','');toast('Sample data loaded (marked SAMPLE)');render()},
 async remove(){D.quiet=true;try{for(const [st] of [['topics'],['equipment'],['flows'],['sessions'],['skills'],['notes'],['questions'],['revisions'],['attempts'],['tasks']])for(const r of S[st].filter(x=>x.sample))await D.remove(st,r.id)}finally{D.quiet=false}D.log('Removed sample data','sample','');toast('Sample data removed');render()}};
ACT.sampleLoad=()=>SAMPLE.load();ACT.sampleRemove=async()=>{if(await confirmDlg('<p>Remove all records marked SAMPLE? Your own records are not touched (any link from your records to sample items will be cleared).</p>',{danger:true,ok:'Remove sample data'}))SAMPLE.remove()};
ACT.clearAll=async()=>{if(!await confirmDlg('<p>This <b>permanently deletes ALL records</b> stored in this browser (equipment, learning, flows, sessions, notes, assessments…). Preferences are kept.</p><p>Download a backup first if you might need this data.</p><p>Type <b>DELETE</b> to confirm.</p><input id="cfType" placeholder="DELETE">',{title:'Delete all data?',danger:true,ok:'Delete everything',type:'DELETE'}))return;
 try{await D.tx(STORES.map(s=>({op:'clear',store:s})));Flow.cur=null;toast('All data deleted');render()}catch(e){toast('Could not clear data: '+e.message,'err')}};
ACT.catAdd=async()=>{const k=$('#cat_kind').value,n=$('#cat_name').value.trim();if(!n)return toast('Enter a category name','warn');await ensureCat(k,n);$('#cat_name').value='';render()};
ACT.catDel=async({id})=>{await D.tx([{op:'del',store:'categories',id}]);render()};
ACT.notifyEnable=async()=>{if(!('Notification' in window))return toast('This browser does not support notifications','err');const p=await Notification.requestPermission();if(p==='granted'){Pref.set('notify',true);toast('Notifications enabled');render()}else{Pref.set('notify',false);toast('Notification permission was not granted','warn');render()}};
ACT.notifyOff=()=>{Pref.set('notify',false);render()};
CHG.pref=({id,val})=>{if(id==='intervals'){const a=String(val).split(',').map(x=>parseInt(x,10)).filter(x=>x>0&&x<=3650);if(!a.length)return toast('Enter intervals like 1,3,7,15,30','err');Pref.set('intervals',[...new Set(a)].sort((x,y)=>x-y))}else if(id==='excludeOptionalDefault')Pref.set(id,!!val);else Pref.set(id,val);if(id==='theme')updateTheme();toast('Setting saved');render()};
V.settings=()=>{const P=Pref.all();const hasS=['topics','equipment','flows','tasks'].some(k=>S[k].some(r=>r.sample));const catKinds=[['equipment','Equipment'],['topic','Learning topic'],['flow','Process flow'],['note','Note'],['skill','Skill']];
 const sel=(id,opts,v)=>`<select data-chg="pref" data-id="${id}">${Form.optHtml(opts,v)}</select>`;
 return`<div class="pagehead"><div><h1>Settings</h1></div></div><div class="grid g2"><div class="card"><h3>Preferences</h3><div class="fg"><div><label class="l">Theme</label>${sel('theme',[['dark','Dark'],['light','Light']],P.theme)}</div><div><label class="l">Default start page</label>${sel('defView',NAV.map(n=>[n[0],n[1]]),P.defView)}</div><div><label class="l">Date format</label>${sel('dateFmt',['DD MMM YYYY','DD/MM/YYYY','MM/DD/YYYY','YYYY-MM-DD'],P.dateFmt)}</div><div><label class="l">PDF page orientation (default)</label>${sel('pdfOrient',[['portrait','A4 portrait'],['landscape','A4 landscape']],P.pdfOrient)}</div><div class="full"><label class="l">Preferred revision intervals (days, comma-separated)</label><input data-chg="pref" data-id="intervals" value="${esc(P.intervals.join(', '))}"></div><div class="full"><label class="chk"><input type="checkbox" data-chg="pref" data-id="excludeOptionalDefault"${P.excludeOptionalDefault?' checked':''}> New topics exclude optional tasks from the completion denominator by default</label></div></div>
 <h4 class="mt">Due-item notifications (optional)</h4><p class="small muted">Shows one browser notification per day when revisions are due, only if you grant permission.</p>${P.notify&&window.Notification&&Notification.permission==='granted'?`<span class="badge ok">Enabled</span> ${btn('notifyOff','Turn off')}`:btn('notifyEnable','Enable notifications')}</div>
 <div class="card"><h3>Sample data</h3><p class="small muted">Demo records are clearly marked <span class="badge sample">SAMPLE</span> and contain only generic, invented text.</p><div class="row">${btn('sampleLoad','Load sample data',{icon:'plus'})}${hasS?btn('sampleRemove','Remove sample data',{icon:'trash',cls:'danger'}):''}</div>
 <h3 class="mt">Backup management</h3><p class="small muted">Last backup: ${Pref.get('lastBackup')?fmtTs(Pref.get('lastBackup')):'never'}</p><a class="btn" href="#/backup">Open Backup & Restore</a>
 <h3 class="mt">Clear data</h3><p class="small muted">Deletes every record in this browser (preferences are kept).</p>${btn('clearAll','Delete all my data…',{icon:'trash',cls:'danger'})}</div></div>
 <div class="card"><h3>Categories</h3><p class="small muted">Suggestions used in category fields. Deleting a category here does not change existing records.</p><div class="row"><select id="cat_kind" style="width:auto">${Form.optHtml(catKinds,'equipment')}</select><input id="cat_name" placeholder="New category name" style="max-width:260px">${btn('catAdd','Add',{icon:'plus'})}</div><div class="mt">${catKinds.map(([k,l])=>{const cs=S.categories.filter(c=>c.kind===k);return cs.length?`<div class="mt"><b>${l}:</b> ${cs.map(c=>`<span class="badge">${esc(c.name)} <a href="#" data-act="catDel" data-id="${c.id}" title="Remove" style="color:var(--danger)">×</a></span>`).join(' ')}</div>`:''}).join('')||'<p class="muted small">No custom categories saved yet. Categories typed into forms are saved automatically. Default skill categories: '+esc(DEF_SKILL_CATS.join(', '))+'.</p>'}</div></div>
 <div class="card"><h3>About</h3><dl class="kv"><dt>Application</dt><dd>${esc(APP.name)} — ${esc(APP.tag)}</dd><dt>Data schema</dt><dd>v${APP.schema}</dd><dt>Storage</dt><dd>${DB.mem?'In-memory only (IndexedDB unavailable)':'IndexedDB “'+APP.db+'” + localStorage for preferences'}</dd><dt>External libraries</dt><dd>Loaded only when needed, from cdnjs.cloudflare.com: jsPDF 2.5.1 and jsPDF-AutoTable 3.8.2 (PDF reports), SheetJS 0.18.5 (XLSX export). Everything else works offline.</dd><dt>Privacy</dt><dd>No account, no analytics, no uploads, no API keys. Your records never leave this browser unless you export them.</dd><dt>Disclaimer</dt><dd>A personal learning tracker — not an official document-control system. Enter technical details only from authorised training material; nothing here is an approved procedure or authorisation.</dd></dl></div>`};

function notifyCheck(){try{if(!Pref.get('notify')||!('Notification' in window)||Notification.permission!=='granted'||Pref.get('lastNotify')===today())return;const n=Calc.revDue().length;if(n){new Notification(APP.name,{body:n+' revision'+(n>1?'s':'')+' due'});Pref.set('lastNotify',today())}}catch(e){}}
async function boot(){buildShell();await DB.init();try{await DB.loadAll()}catch(e){console.error(e);toast('Could not read stored data: '+e.message,'err')}
 try{if(!location.hash)history.replaceState(null,'','#/'+(Pref.get('defView')||'dashboard'))}catch(e){}render();notifyCheck();
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}
window.addEventListener('error',e=>console.error('Unhandled error:',e.message));
window.addEventListener('unhandledrejection',e=>{console.error('Unhandled rejection:',e.reason)});
boot();
