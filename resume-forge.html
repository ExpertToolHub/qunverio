<title>Resume Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Lato:wght@400;700&family=Open+Sans:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@500;700&family=EB+Garamond:wght@400;600&family=Raleway:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Great+Vibes&family=Homemade+Apple&display=swap">
<style>
/* Layout concept: left control panel (templates, content, design, ATS, export) + right live A4 preview stage. */
:root{
  --bg:#E9EDF2; --panel:#FFFFFF; --panel2:#F2F5F9; --ink:#13202F; --muted:#586A7D; --line:#D6DDE6;
  --accent:#2150E8; --accent-ink:#FFFFFF; --accent-soft:#E2E9FE;
  --good:#0F8A5F; --warn:#A86500; --bad:#C23B2E; --stage:#C7CFDA;
  --shadow:0 1px 2px rgba(15,30,50,.08),0 10px 34px rgba(15,30,50,.16);
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131B; --panel:#151D28; --panel2:#1B2532; --ink:#E6ECF4; --muted:#93A3B6; --line:#2A3748;
    --accent:#7390FF; --accent-ink:#0A1020; --accent-soft:#1F2D57;
    --good:#3FC596; --warn:#E3A33B; --bad:#F0786B; --stage:#080C11;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131B; --panel:#151D28; --panel2:#1B2532; --ink:#E6ECF4; --muted:#93A3B6; --line:#2A3748;
  --accent:#7390FF; --accent-ink:#0A1020; --accent-soft:#1F2D57;
  --good:#3FC596; --warn:#E3A33B; --bad:#F0786B; --stage:#080C11;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- app shell ---------- */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.logo svg{flex:none}
.sp{flex:1}
.savestat{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;line-height:1.2}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.ib{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;border-radius:7px;color:var(--muted)}
.ib:hover{background:var(--panel2);color:var(--ink)}
.ib.on{color:var(--accent)}
.ib svg{width:16px;height:16px}
.resbtn{max-width:220px}
.resbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop{position:absolute;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;min-width:260px;max-width:92vw;z-index:50}
.pop .row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer}
.pop .row:hover{background:var(--panel2)}
.pop .row.cur{background:var(--accent-soft)}
.pop .row b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .row small{color:var(--muted)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pop input[type=text]{width:100%;margin:4px 0 6px}

.work{display:grid;grid-template-columns:minmax(380px,452px) minmax(0,1fr);min-height:0}
.pwrap{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:9px 11px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.tab svg{display:none}
.panel{flex:1;min-height:0;overflow:auto;padding:14px 14px 28px;scrollbar-width:thin}
.panel h3{font-family:var(--f-disp);font-size:16px;margin:0 0 4px}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.stage-wrap{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--stage)}
.stagebar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.stagebar .grp{display:flex;align-items:center;gap:4px}
.tplname{font-weight:700;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.zoomsel{width:auto;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 6px;font-size:12px}
.atsbadge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 4px;background:var(--panel);font-weight:700;font-size:12px}
.atsbadge i{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:11px}
.stagescroll{flex:1;min-height:0;overflow:auto;padding:22px 16px 40px;scrollbar-width:thin}
.stagebox{position:relative;margin:0 auto;box-shadow:var(--shadow);background:#fff}
.stagebox .sheet{transform-origin:0 0}
.guide{position:absolute;left:0;right:0;border-top:2px dashed #e0457b;pointer-events:none;z-index:5}
.guide span{position:absolute;right:6px;top:4px;background:#e0457b;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.pagelabel{position:absolute;left:6px;font-size:11px;font-weight:700;background:rgba(20,32,47,.72);color:#fff;padding:2px 8px;border-radius:5px;pointer-events:none;z-index:5}
.mobnav{display:none}
.hosts{position:fixed;left:0;top:0;width:0;height:0;overflow:visible;z-index:-1;pointer-events:none}
#mhost,#xhost{position:fixed;left:0;top:0}
#mhost{visibility:hidden}

/* ---------- form bits ---------- */
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px}
.card>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:10px 10px 10px 12px;cursor:pointer;font-weight:700;border-radius:12px}
.card>summary::-webkit-details-marker{display:none}
.card>summary .chev{width:14px;height:14px;color:var(--muted);transition:transform .15s;flex:none}
.card[open]>summary .chev{transform:rotate(90deg)}
.card>summary .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card>summary .cnt{font-weight:600;font-size:11px;color:var(--muted);background:var(--panel2);border-radius:99px;padding:1px 8px}
.card.off>summary .ttl{opacity:.5;text-decoration:line-through}
.card .cbody{padding:2px 12px 12px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span,.lbl{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.fld.full{grid-column:1/-1}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;min-width:0}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.item{border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.item>summary{list-style:none;display:flex;align-items:center;gap:4px;padding:7px 8px;cursor:pointer;font-weight:600;font-size:13px}
.item>summary::-webkit-details-marker{display:none}
.item>summary .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ibody{padding:4px 10px 12px;display:flex;flex-direction:column;gap:10px}
.item .ib{width:26px;height:26px}
.sw{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip small{opacity:.7;margin-left:3px}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.swatch[aria-pressed=true]{box-shadow:0 0 0 2px var(--accent)}
.row2{display:flex;align-items:center;gap:8px}
.row2>*{min-width:0}
.valtag{font-size:12px;color:var(--muted);min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.media{display:flex;align-items:center;gap:12px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:var(--panel2)}
.media .pv{width:64px;height:64px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;color:var(--muted)}
.media .pv img{width:100%;height:100%;object-fit:cover}
.media .pv.sig img{object-fit:contain;padding:4px}
.media .pv.sig{width:110px}
.media .acts{display:flex;gap:6px;flex-wrap:wrap}

/* gallery */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{position:relative;border:2px solid transparent;border-radius:10px;background:var(--panel2);padding:0;overflow:hidden;text-align:left;box-shadow:0 1px 3px rgba(15,30,50,.12)}
.tcard:hover{border-color:var(--accent-soft)}
.tcard[aria-pressed=true]{border-color:var(--accent)}
.tcard .thumb{position:relative;overflow:hidden;background:#fff;width:100%}
.tcard .thumb .sheet{position:absolute;left:0;top:0;transform-origin:0 0;height:var(--H)}
.tcard .num{position:absolute;right:6px;top:6px;min-width:26px;height:26px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px;z-index:2}
.tcard .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;font-size:12px;font-weight:700;background:var(--panel)}
.tcard .meta span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .meta small{font-weight:600;color:var(--muted)}
.tag-ats{white-space:nowrap;flex:none;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px;color:#fff}

/* ATS */
.gauge{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);margin-bottom:12px}
.gauge svg{flex:none}
.gauge .gt{font-family:var(--f-disp);font-size:18px;font-weight:700;margin-bottom:2px}
.chk{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk:last-child{border-bottom:0}
.dot{flex:none;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;margin-top:1px}
.dot.pass{background:var(--good)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--bad)}
.chk .tip{color:var(--muted);font-size:12.5px}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span,.kw button{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.kw .hit{background:color-mix(in srgb,var(--good) 16%,var(--panel));border-color:var(--good);color:var(--good)}
.kw .miss{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border-color:var(--bad);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* export */
.opt{display:grid;gap:8px}
.opt.c2{grid-template-columns:1fr 1fr}.opt.c3{grid-template-columns:1fr 1fr 1fr}
.optbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 10px;text-align:left;font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:2px}
.optbtn small{font-weight:500;color:var(--muted);font-size:11.5px}
.optbtn[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--muted)}
.note.warn{border-color:var(--warn);color:var(--warn)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(8,14,22,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.mbox{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-family:var(--f-disp);font-size:17px;flex:1}
.mbody{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.cropbox{display:flex;justify-content:center;background:repeating-conic-gradient(#d9dfe7 0 25%,#f2f5f9 0 50%) 0 0/16px 16px;border-radius:12px;padding:12px}
.cropbox canvas{touch-action:none;cursor:grab;max-width:100%;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 14px;text-align:center;color:var(--muted);background:var(--panel2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.sigpad{background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;width:100%;height:auto;display:block;cursor:crosshair}
.fontpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fontpick button{border:1px solid var(--line);background:#fff;color:#111;border-radius:10px;padding:8px;font-size:24px;line-height:1.1;text-align:center;overflow:hidden;white-space:nowrap}
.fontpick button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom,0px) + 70px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:200;box-shadow:var(--shadow);max-width:92vw;text-align:center}
.empty{color:var(--muted);text-align:center;padding:16px}

@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr)}
  .work[data-view=edit] .stage-wrap{display:none}
  .work[data-view=view] .pwrap{display:none}
  .mobnav{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .mobnav button{border:0;background:transparent;padding:11px;font-weight:700;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
  .mobnav button[aria-pressed=true]{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
  .savestat{display:none}
  .toast{bottom:80px}
  .logo span{display:none}
  .stagescroll{padding:12px 8px 28px}
}

/* =====================================================================
   RESUME SHEET (used for preview, thumbnails and export)
   ===================================================================== */
.sheet{--W:794px;--H:1123px;--pbg:#fff;--tx:#232A33;--mu:#5E6874;--line2:#D9DEE6;--up:uppercase;
  width:var(--W);min-height:var(--H);position:relative;background:var(--pbg);color:var(--tx);
  font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);overflow:hidden;text-align:left;
  display:flex;flex-direction:column;letter-spacing:0;
  --trk:rgba(0,0,0,.11);--bar:var(--ac);--dot:var(--ac);--dotoff:rgba(0,0,0,.14)}
.sheet *{box-sizing:border-box}
.sheet h1,.sheet h2,.sheet p,.sheet ul,.sheet li{margin:0;padding:0}
.sheet ul{list-style:none}
.sheet img{max-width:none;display:block}
.sheet.pg-cream{--pbg:#FBF9F4}
.sheet.pg-dark{--pbg:var(--dk);--tx:#E9EDF5;--mu:#AEB8CA;--line2:rgba(255,255,255,.2);--trk:rgba(255,255,255,.18);--bar:var(--ac);--dotoff:rgba(255,255,255,.2)}

.sheet .r-head{padding:var(--pad) var(--pad) 0;display:flex;align-items:center;gap:22px}
.sheet .r-hmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.sheet .r-name{font-size:2.55em;line-height:1.08;font-weight:700;letter-spacing:-.01em;color:var(--ac)}
.sheet .r-title{font-size:1.2em;font-weight:500;color:var(--mu)}
.sheet .r-contacts{display:flex;flex-wrap:wrap;gap:3px 16px;font-size:.92em;color:var(--mu);margin-top:3px}
.sheet .r-ct{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sheet .r-ct svg{flex:none}
.sheet .r-photo{flex:none;overflow:hidden;background:var(--ac3)}
.sheet .r-photo img{width:100%;height:100%;object-fit:cover}
.sheet .r-photo.ph{display:flex;align-items:center;justify-content:center}

.sheet .r-body{padding:16px var(--pad) var(--pad);display:flex;flex-direction:column;gap:var(--gap);flex:1}
.sheet .r-sec{display:flex;flex-direction:column}
.sheet .blk+.blk{margin-top:9px}
.sheet .r-h{font-size:1.06em;font-weight:700;letter-spacing:.09em;text-transform:var(--up);color:var(--ac);margin-bottom:8px}
.sheet .r-p{white-space:normal}
.sheet .r-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sheet .r-main{min-width:0}
.sheet .r-role{font-weight:700;font-size:1.04em;color:var(--tx)}
.sheet .r-org{color:var(--mu);font-weight:500}
.sheet .r-date{color:var(--mu);font-size:.92em;white-space:nowrap;font-weight:500}
.sheet .r-ul{margin-top:4px}
.sheet .r-ul li{position:relative;padding-left:13px;margin-top:2px}
.sheet .r-ul li::before{content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--ac)}

/* ---------- build full sheet HTML ---------- */
function buildHTML(d, tpl, ds, opt) {
  opt = opt || {};
  const L = LAYOUTS[tpl.layout], T = themeVars(tpl, ds), PG = PAGES[ds.page] || PAGES.a4, pad = PADS[ds.pad] || 40;
  const fontKey = FONTS[ds.font] ? ds.font : tpl.font;
  const ctx = { d, tpl, ds, L, T, opt, skillStyle: ds.skillStyle === 'auto' ? L.skills : ds.skillStyle };
  const order = d.order.filter(k => !d.hidden[k] && hasContent(k, d));
  const vars = `--W:${PG.w}px;--H:${PG.h}px;--ac:${T.ac};--ac2:${T.ac2};--ac3:${T.ac3};--acm:${T.acm};--dk:${T.dk};--acl:${T.acl};--ff:${FONTS[fontKey][1]};--fs:${ds.fs}px;--lh:${ds.lh};--pad:${pad}px;--gap:${ds.gap}px;--up:${ds.upper ? 'uppercase' : 'none'}`;
  const cls = `sheet lay-${tpl.layout} cols-${L.cols} h-${L.head} sec-${L.sec} exp-${L.exp} skin-${L.skin || 'none'} pg-${L.pg}`;
  let inner = '';
  if (L.cols === 'one') {
    inner = headHTML(ctx, true, true) + `<div class="r-body">${order.map(k => sectionHTML(k, d, ctx, false)).join('')}${signHTML(ctx)}</div>`;
  } else if (L.cols === 'two') {
    const main = order.filter(k => !TWO_SIDE.includes(k)), side = order.filter(k => TWO_SIDE.includes(k));
    inner = headHTML(ctx, true, true) + `<div class="r-cols"><div class="r-cmain">${main.map(k => sectionHTML(k, d, ctx, false)).join('')}${signHTML(ctx)}</div><div class="r-cside">${side.map(k => sectionHTML(k, d, ctx, true)).join('')}</div></div>`;
  } else {
    const sw = Math.round(clamp(ds.photoSize * 1.4, 100, 130));
    const main = order.filter(k => !SIDE_KEYS.includes(k)), side = order.filter(k => SIDE_KEYS.includes(k));
    const cont = contactList(d).length ? `<section class="r-sec"><div class="blk r-first"><h2 class="r-h">Contact</h2>${contactsHTML(ctx, 'side')}</div></section>` : '';
    inner = `<aside class="r-side">${photoHTML(ctx, sw)}${cont}${side.map(k => sectionHTML(k, d, ctx, true)).join('')}</aside><div class="r-mainc">${headHTML(ctx, false, false)}${main.map(k => sectionHTML(k, d, ctx, false)).join('')}${signHTML(ctx)}</div>`;
  }
  return `<div class="${cls}" style="${vars}">${inner}</div>`;

/* ---------- pagination (keeps blocks whole across page breaks) ---------- */
function paginate(sheet, H, pad) {
  sheet.querySelectorAll('.blk').forEach(b => { b.style.marginTop = ''; });
  sheet.style.height = 'auto';
  const blks = Array.from(sheet.querySelectorAll('.blk'));
  for (const b of blks) {
    const sr = sheet.getBoundingClientRect(), r = b.getBoundingClientRect();
    const t = r.top - sr.top, bt = r.bottom - sr.top;
    if (r.height > H - 2 * pad) continue;
    const page = Math.floor((t + 0.01) / H);
    const limit = (page + 1) * H - pad;
    if (bt > limit + 0.5) {
      const target = (page + 1) * H + pad;
      const cur = parseFloat(getComputedStyle(b).marginTop) || 0;
      b.style.marginTop = (cur + (target - t)) + 'px';
    }
  }
  const pages = Math.max(1, Math.ceil((sheet.scrollHeight - 2) / H));
  sheet.style.height = (pages * H) + 'px';
  return pages;
}
function finalize(d, tpl, ds, opt) {
  const host = document.getElementById('mhost');
  const PG = PAGES[ds.page] || PAGES.a4;
  host.innerHTML = buildHTML(d, tpl, ds, opt);
  const sheet = host.firstElementChild;
  const pages = paginate(sheet, PG.h, PADS[ds.pad] || 40);
  const html = host.innerHTML;
  host.innerHTML = '';
  return { html, pages, W: PG.w, H: PG.h };
}

function resumeText(d) {
  const out = []; const p = d.personal;
  out.push(p.name, p.title, contactList(d).map(x => x[1]).join(' | '));
  d.order.filter(k => !d.hidden[k] && hasContent(k, d)).forEach(k => {
    out.push('', sectionTitle(k, d).toUpperCase());
    if (k === 'summary') out.push(d.summary);
    else if (k === 'experience') d.experience.filter(e => filled(e, ['role', 'company', 'bullets'])).forEach(e => { out.push([e.role, e.company, e.location, dateRange(e)].filter(Boolean).join(' | ')); bulletsOf(e.bullets).forEach(b => out.push('- ' + b)); });
    else if (k === 'education') d.education.filter(e => filled(e, ['degree', 'school'])).forEach(e => { out.push([e.degree, e.school, e.location, dateRange(e), e.grade].filter(Boolean).join(' | ')); bulletsOf(e.details).forEach(b => out.push('- ' + b)); });
    else if (k === 'skills') out.push(d.skills.map(s => s.name).filter(Boolean).join(', '));
    else if (k === 'languages') out.push(d.languages.filter(s => s.name).map(s => `${s.name} (${levelLabel(s.level)})`).join(', '));
    else if (k === 'projects') d.projects.filter(x => filled(x, ['name', 'desc'])).forEach(x => { out.push([x.name, x.link].filter(Boolean).join(' | ')); bulletsOf(x.desc).forEach(b => out.push('- ' + b)); });
    else if (k === 'certifications') d.certifications.filter(x => x.name).forEach(x => out.push([x.name, x.issuer, x.year].filter(Boolean).join(' | ')));
    else if (k === 'achievements') d.achievements.filter(x => x.text).forEach(x => out.push('- ' + x.text));
    else if (k === 'interests') out.push(d.interests.map(x => x.text).filter(Boolean).join(', '));
    else if (k === 'references') d.references.filter(x => x.name).forEach(x => out.push([x.name, x.role, x.contact].filter(Boolean).join(' | ')));
    else if (k === 'details') d.details.filter(x => x.label || x.value).forEach(x => out.push(`${x.label}: ${x.value}`));
    else if (k.startsWith('c_')) { const c = d.custom.find(x => 'c_' + x.id === k); if (c) bulletsOf(c.items).forEach(b => out.push('- ' + b)); }
  });
  return out.filter((x, i) => x !== undefined && (x !== '' || i > 0)).join('\n');
}

const STOP = new Set('the,and,for,with that this from are you your our will have has had was were been being can able not but all any more most other some such than then them they their there these those who whom whose which what when where why how into onto over under about above below between through during before after again further once here both each few own same too very just also its etc per via including include includes etc job role work works working team teams company candidate candidates ability strong experience years year plus must should would could may might looking join looking seeking required requirements preferred responsibilities responsible duties opportunity position apply across within use using used good great new well best make making help helping need needs get gets like one two three'.split(/\s+/));
const ACTION_VERBS = new Set('led,managed,built,developed,designed,launched,created,improved,increased,reduced,delivered,owned,drove,achieved,implemented,optimized,optimised,streamlined,negotiated,coordinated,analyzed,analysed,automated,mentored,trained,planned,executed,established,generated,secured,saved,grew,scaled,migrated,resolved,authored,directed,spearheaded,introduced,transformed,supervised,maintained,organized,organised,presented,researched,tested,deployed,integrated,collaborated,cut,boosted,won,drafted,audited,forecasted,conducted,initiated,redesigned,revamped,orchestrated,championed,accelerated,administered,advised,evaluated,expanded,facilitated,formulated,handled,identified,leveraged,monitored,oversaw,partnered,processed,produced,programmed,recruited,reviewed,simplified,standardized,unified,ran,gathered,published,owned,wrote,taught,sold,closed,hired,engineered,architected,defined,shipped,rebuilt'.split(','));
const BUZZ = ['hard-working', 'hardworking', 'team player', 'go-getter', 'results-oriented', 'detail-oriented', 'self-motivated', 'synergy', 'think outside the box', 'rockstar', 'ninja', 'guru', 'passionate about'];
const WEAK = ['responsible for', 'duties included', 'worked on', 'helped with', 'assisted with', 'tasked with'];
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function jdKeywords(jd) {
  const words = String(jd || '').toLowerCase().replace(/[^a-z0-9+#.\s/-]/g, ' ').split(/\s+/).map(w => w.replace(/^[.\-/]+|[.\-/]+$/g, '')).filter(w => w.length >= 3 && !STOP.has(w) && !/^\d+$/.test(w));
  const freq = {}; words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
  const bi = {}; for (let i = 0; i < words.length - 1; i++) { const k = words[i] + ' ' + words[i + 1]; bi[k] = (bi[k] || 0) + 1; }
  const uni = Object.entries(freq).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 28).map(x => x[0]);
  const bis = Object.entries(bi).filter(x => x[1] >= 2).sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]);
  return Array.from(new Set(bis.concat(uni))).slice(0, 32);
}
function atsReport(d, tpl, ds, pages) {
  const L = LAYOUTS[tpl.layout]; const groups = []; let earned = 0, total = 0;
  const G = name => { const g = { name, items: [] }; groups.push(g); return g; };
  const add = (g, w, frac, text, tip) => { frac = clamp(frac, 0, 1); total += w; earned += w * frac; g.items.push({ st: frac >= .99 ? 'pass' : frac >= .5 ? 'warn' : 'fail', text, tip: frac >= .99 ? '' : tip }); };
  const p = d.personal;
  let g = G('Contact details');
  add(g, 3, p.name.trim() ? 1 : 0, p.name.trim() ? 'Name is present' : 'Name is missing', 'Add your full name at the top.');
  const okMail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((p.email || '').trim());
  add(g, 3, okMail ? 1 : 0, okMail ? 'Email looks valid' : 'Email is missing or invalid', 'Use a professional email address that recruiters can reply to.');
  const okPh = (p.phone || '').replace(/\D/g, '').length >= 8;
  add(g, 2, okPh ? 1 : 0, okPh ? 'Phone number found' : 'Phone number is missing', 'Add a phone number with country code.');
  add(g, 2, (p.address || '').trim() ? 1 : 0, (p.address || '').trim() ? 'Location is listed' : 'Location is missing', 'Add your city and country. Many ATS filter by location.');

  g = G('Content');
  const sw = wordCount(d.summary);
  add(g, 6, sw === 0 ? 0 : (sw >= 30 && sw <= 110 ? 1 : .6), sw === 0 ? 'No summary' : `Summary is ${sw} words`, sw === 0 ? 'Add a 2 to 4 line summary with your title, years of experience and top strengths.' : (sw < 30 ? 'Expand the summary to at least 30 words.' : 'Trim the summary to under 110 words.'));
  const exps = d.experience.filter(e => filled(e, ['role', 'company', 'bullets']));
  add(g, 8, exps.length ? 1 : (d.education.some(e => e.degree) ? .4 : 0), exps.length ? `${exps.length} work experience ${exps.length > 1 ? 'entries' : 'entry'}` : 'No work experience', 'Add internships, projects or volunteering if you are a fresher.');
  if (exps.length) {
    const complete = exps.filter(e => e.role.trim() && e.company.trim() && (e.start || e.end || e.current)).length / exps.length;
    add(g, 6, complete, complete === 1 ? 'Every job has title, company and dates' : 'Some jobs are missing title, company or dates', 'ATS parsers need all three for each role.');
    const bl = exps.map(e => bulletsOf(e.bullets));
    const withBul = bl.filter(b => b.length >= 2).length / exps.length;
    add(g, 6, withBul, withBul === 1 ? 'Every job has 2 or more bullet points' : 'Some jobs have fewer than 2 bullet points', 'Use 3 to 5 short bullets per recent role.');
    const all = bl.flat();
    if (all.length) {
      const num = all.filter(b => /\d/.test(b)).length / all.length;
      add(g, 6, num / .4, num >= .4 ? `${Math.round(num * 100)}% of bullets include numbers` : `Only ${Math.round(num * 100)}% of bullets include numbers`, 'Add metrics such as %, amounts, users or time saved to at least 40% of bullets.');
      const verb = all.filter(b => { const w = b.split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g, ''); return ACTION_VERBS.has(w) || (w.length > 3 && w.endsWith('ed')); }).length / all.length;
      add(g, 5, verb / .7, verb >= .7 ? 'Bullets start with strong action verbs' : 'Many bullets do not start with an action verb', 'Start bullets with verbs like Led, Built, Reduced, Launched.');
      const avg = all.reduce((a, b) => a + wordCount(b), 0) / all.length;
      add(g, 3, avg <= 28 ? 1 : .5, avg <= 28 ? `Bullets average ${Math.round(avg)} words` : `Bullets average ${Math.round(avg)} words`, 'Keep each bullet under about 25 words.');
    }
  }
  const sk = d.skills.filter(s => s.name.trim()).length;
  add(g, 8, sk / 8, sk >= 8 ? `${sk} skills listed` : `${sk} skills listed`, 'List at least 8 relevant hard skills and tools.');
  const edu = d.education.some(e => filled(e, ['degree', 'school']));
  add(g, 5, edu ? 1 : .3, edu ? 'Education section is present' : 'No education listed', 'Add your highest qualification.');

  g = G('Format and layout');
  add(g, 8, L.ats >= 85 ? 1 : L.ats >= 65 ? .6 : .25, L.ats >= 85 ? `Template "${tpl.name}" is parser friendly` : `Template "${tpl.name}" uses columns or graphics`, 'Switch to a single column template such as Classic, Executive or Compact for strict ATS.');
  add(g, 3, pages <= 1 ? 1 : pages === 2 ? 1 : .4, `Length is ${pages} ${pages > 1 ? 'pages' : 'page'}`, 'Keep the resume within 2 pages.');
  const hasPhoto = !!d.photo && ds.showPhoto !== false;
  add(g, 2, hasPhoto ? .4 : 1, hasPhoto ? 'Photo included' : 'No photo', 'Most ATS ignore photos and many US, UK and EU employers prefer none. Keep it only if your market expects it.');
  const style = ds.skillStyle === 'auto' ? L.skills : ds.skillStyle;
  const gfx = ['bars', 'dots', 'circles'].includes(style);
  add(g, 3, gfx ? .5 : 1, gfx ? 'Skill levels are drawn as graphics' : 'Skills are plain text', 'Use text, chips or two column skills so parsers read each skill.');
  const renamed = STD_KEYS.some(k => d.titles[k] && d.titles[k].trim() && d.titles[k].trim().toLowerCase() !== SECTION_TITLES[k].toLowerCase());
  add(g, 3, renamed ? .5 : 1, renamed ? 'Some section headings were renamed' : 'Standard section headings', 'Keep standard headings such as Work Experience, Education and Skills.');

  g = G('Language quality');
  const body = [d.summary].concat(exps.flatMap(e => bulletsOf(e.bullets))).join(' \n ');
  const fp = (body.match(/\b(I|my|me|myself)\b/g) || []).length;
  add(g, 4, Math.max(0, 1 - fp / 4), fp ? `${fp} first person words (I, my, me)` : 'No first person pronouns', 'Write in implied first person: "Led a team" not "I led a team".');
  const low = body.toLowerCase();
  const buzz = BUZZ.filter(b => low.includes(b));
  add(g, 3, buzz.length ? Math.max(0, 1 - buzz.length / 3) : 1, buzz.length ? `Buzzwords found: ${buzz.join(', ')}` : 'No empty buzzwords', 'Replace buzzwords with proof such as results and numbers.');
  const weak = WEAK.filter(b => low.includes(b));
  add(g, 3, weak.length ? Math.max(0, 1 - weak.length / 3) : 1, weak.length ? `Weak phrases: ${weak.join(', ')}` : 'No weak phrases', 'Replace "responsible for" with a result driven verb.');

  let kw = null;
  const jd = (d.jd || '').trim();
  if (jd.length > 40) {
    g = G('Job description match');
    const words = jdKeywords(jd); const txt = resumeText(d).toLowerCase();
    const hit = [], miss = [];
    words.forEach(w => { (new RegExp('(^|[^a-z0-9])' + reEsc(w) + '([^a-z0-9]|$)')).test(txt) ? hit.push(w) : miss.push(w); });
    const cov = words.length ? hit.length / words.length : 0;
    add(g, 12, cov / .7, `${Math.round(cov * 100)}% of the top job keywords appear in your resume`, 'Work the missing keywords into your summary, skills and bullets where they are true.');
    kw = { hit, miss, cov };
  }
  const score = total ? Math.round(earned / total * 100) : 0;
  return { score, groups, kw };
}

function renderTemplates() {

  const cnt = k => TPLS.filter(t => k === 'all' || t.tags.includes(k)).length;
  $('#panel').innerHTML = `<h3>${TPLS.length} templates</h3><p class="hint">Tap a template to apply it. Your content, colors and fonts stay as you set them.</p>
  <div class="filters">${FILTERS.map(f => `<button class="chip" data-filter="${f[0]}" aria-pressed="${ui.filter === f[0]}">${f[1]}<small>${cnt(f[0])}</small></button>`).join('')}</div>
  <div class="gal" id="gal">${list.map(t => { const L = LAYOUTS[t.layout]; const c = L.ats >= 85 ? 'var(--good)' : L.ats >= 65 ? 'var(--warn)' : 'var(--bad)'; return `<button class="tcard" data-tpl="${t.n}" aria-pressed="${S.design.tpl === t.n}" aria-label="Template ${t.n}, ${esc(t.name)}"><span class="num">${t.n}</span><div class="thumb" data-n="${t.n}"></div><div class="meta"><span>${esc(t.name)}</span><span class="tag-ats" style="background:${c}">ATS ${L.ats}</span></div></button>`; }).join('')}</div>`;

/* ---------- ATS tab ---------- */
function gaugeSVG(score) {
  const c = score >= 80 ? 'var(--good)' : score >= 60 ? 'var(--warn)' : 'var(--bad)'; const r = 34, C = 2 * Math.PI * r, dash = C * score / 100;
  return `<svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="ATS score ${score} out of 100"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${(C - dash).toFixed(1)}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque,Figtree,sans-serif">${score}</text></svg>`;
}
const scoreWord = s => s >= 85 ? 'Excellent' : s >= 70 ? 'Good' : s >= 50 ? 'Needs work' : 'Poor';
function renderAtsTab() {
  $('#panel').innerHTML = `<div id="atsOut"></div>
  <div class="card" style="padding:12px;margin-top:12px"><div class="lbl" style="margin-bottom:6px">Paste a job description to check keyword match</div><textarea id="f_data_jd" data-p="data.jd" rows="6" placeholder="Paste the job posting here. Resume Forge finds the key terms and shows which ones your resume is missing.">${esc(S.data.jd)}</textarea></div>`;
  renderAtsOut();
}
function renderAtsOut() {
  const el = $('#atsOut'); if (!el || !ui.ats) return; const r = ui.ats;
  const c = r.score >= 80 ? 'var(--good)' : r.score >= 60 ? 'var(--warn)' : 'var(--bad)';
  let h = `<div class="gauge">${gaugeSVG(r.score)}<div><div class="gt" style="color:${c}">${scoreWord(r.score)}</div><div class="hint" style="margin:0">Estimated readability by applicant tracking systems. It updates as you edit.</div></div></div>`;
  h += `<div class="note" style="margin-bottom:12px"><b>Tip:</b> the normal PDF is a high quality picture, which ATS software cannot read. When you apply on a job portal, download <b>Text PDF (ATS)</b> from the Download tab.</div>`;
  r.groups.forEach(g => { h += `<details class="card" open><summary>${SV.chev}<span class="ttl">${esc(g.name)}</span></summary><div class="cbody" style="gap:0">${g.items.map(i => `<div class="chk"><span class="dot ${i.st}">${i.st === 'pass' ? '✓' : i.st === 'warn' ? '!' : '×'}</span><div><div>${esc(i.text)}</div>${i.tip ? `<div class="tip">${esc(i.tip)}</div>` : ''}</div></div>`).join('')}</div></details>`; });
  if (r.kw) {
    h += `<details class="card" open><summary>${SV.chev}<span class="ttl">Keywords from the job post</span><span class="cnt">${Math.round(r.kw.cov * 100)}%</span></summary><div class="cbody"><div class="bar"><i style="width:${Math.round(r.kw.cov * 100)}%"></i></div>
    ${r.kw.miss.length ? `<div class="lbl">Missing. Tap to add to Skills if it is true for you.</div><div class="kw">${r.kw.miss.map(k => `<button type="button" class="miss" data-act="kwadd" data-k="${esc(k)}">+ ${esc(k)}</button>`).join('')}</div>` : ''}
    ${r.kw.hit.length ? `<div class="lbl">Found in your resume</div><div class="kw">${r.kw.hit.map(k => `<span class="hit">${esc(k)}</span>`).join('')}</div>` : ''}</div></details>`;
  }
  el.innerHTML = h;
}
function updateBadge() {
  const r = ui.ats; if (!r) return; const c = r.score >= 80 ? 'var(--good)' : r.score >= 60 ? 'var(--warn)' : 'var(--bad)';
  $('#atsDot').style.background = c; $('#atsDot').textContent = r.score; $('#atsTxt').textContent = 'ATS ' + scoreWord(r.score);

function renderPreview() {

  const tpl = curTpl(); const r = finalize(S.data, tpl, S.design, { placeholder: true });
  ui.pages = r.pages; ui.W = r.W; ui.H = r.H;
  $('#sheetMount').innerHTML = r.html;
  ui.ats = atsReport(S.data, tpl, S.design, r.pages);
  updateBadge();
  $('#tplName').textContent = `${tpl.n}. ${tpl.name}`;
  applyScale();
}
function applyScale() {

  const avail = sc.clientWidth - (innerWidth <= 860 ? 16 : 32);

  if (a === 'iadd') { const it = NEWITEM[k](); d[k].push(it); ui.openItem[it.id] = true; ui.openSec[k] = true; d.hidden[k] = false; return structural(); }
  if (a === 'bulk') { const inp = $('#bulkSkills'); const names = (inp.value || '').split(/[,\n;]+/).map(s => s.trim()).filter(Boolean); names.forEach(n => d.skills.push({ id: uid(), name: n, level: 80 })); if (names.length) { d.hidden.skills = false; structural(); } return; }
  if (a === 'qd') { d.details.push({ id: uid(), label: k, value: '' }); d.hidden.details = false; ui.openSec.details = true; return structural(); }
  if (a === 'kwadd') { if (!d.skills.some(s => s.name.toLowerCase() === k.toLowerCase())) d.skills.push({ id: uid(), name: k, level: 80 }); d.hidden.skills = false; return changed(), toast('Added "' + k + '" to Skills'); }
  if (a === 'clear') { if (b.dataset.sure) { const keep = { design: S.design }; S.data = blankData(); return structural(); } b.dataset.sure = '1'; b.textContent = 'Tap again to clear everything'; return; }
  if (a === 'sample') { S.data = sampleData(); S.design.tpl = S.design.tpl || 1; return structural(); }
  if (['iup', 'idown', 'idup', 'idel'].includes(a)) {
    const [list, is] = k.split(':'); const i = Number(is); const arr = d[list];
    if (a === 'iup') mv(arr, i, -1); else if (a === 'idown') mv(arr, i, 1);
    else if (a === 'idup') { const c = clone(arr[i]); c.id = uid(); arr.splice(i + 1, 0, c); } else if (a === 'idel') arr.splice(i, 1);
    return structural();
  }
}
function backupSave() {
  const blob = new Blob([JSON.stringify({ app: 'resume-forge', v: 1, name: S.name, data: S.data, design: S.design })], { type: 'application/json' });
  saveFile(fileBase() + '_backup.json', blob).then(r => { if (r === 'saved') toast('Backup saved'); }).catch(() => toast('Could not save the backup.'));
}
async function backupLoad(file) {
  if (!file) return;
  try {
    const j = JSON.parse(await file.text()); if (!j || !j.data) throw new Error('bad');
    await saveNow(); const id = uid(); const m = migrate(j); const nm = (j.name || 'Restored resume') + ' (restored)';
    IDX.list.push({ id, name: nm, updated: Date.now() }); IDX.cur = id; await DB.set('r:' + id, { name: nm, data: m.data, design: m.design }); await DB.set('index', IDX);
    S = { id, name: nm, data: m.data, design: m.design }; $('#resName').textContent = nm; ui.tab = 'content'; renderTabs(); renderPanel(); renderPreview(); toast('Backup restored as a new resume');
  } catch (e) { toast('That file is not a Resume Forge backup.'); }
}

/* ---------- boot ---------- */
async function boot() {
  try { const t = localStorage.getItem('rf-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }
  await DB.open();
  const idx = await DB.get('index'); let rec = null;
  if (idx && idx.cur && Array.isArray(idx.list)) { IDX = idx; rec = await DB.get('r:' + idx.cur); }
  if (rec && rec.data) { const m = migrate(rec); S = { id: IDX.cur, name: rec.name || 'My Resume', data: m.data, design: m.design }; }
  else { const id = uid(); S = { id, name: 'My Resume', data: sampleData(), design: defaultDesign() }; IDX = { cur: id, list: [{ id, name: S.name, updated: Date.now() }] }; await saveNow(); }
  $('#resName').textContent = S.name;
  renderTabs(); bindEvents(); renderPanel(); renderPreview(); setView('edit');
  $('#saveStat').textContent = DB.ok ? 'Saved on this device' : 'Not saved (storage blocked)';
  try { await document.fonts.ready; renderPreview(); if (ui.tab === 'templates') renderPanel(true); } catch (e) { /* ignore */ }
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { clearTimeout(rT); rT = setTimeout(renderPreview, 120); });
  try { sampleFn = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { sampleFn = null; }
  if (sampleFn) { ui.ai = true; if (ui.tab === 'content') renderPanel(true); }
}
boot();
</script>
