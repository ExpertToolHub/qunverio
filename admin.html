<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Qunverio Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><script src="/fb-config.js"></script>
<style>
:root{--bg:#F1F6F4;--cd:#fff;--ink:#0A2B2E;--mu:#4F6E6D;--ln:#D6E4E0;--ac:#0B8577;--dn:#DC2626}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--cd);border-right:1px solid var(--ln);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.side h1{font-size:22px;margin:4px 8px 16px}.side a{display:block;padding:9px 12px;border-radius:10px;color:var(--mu);font-weight:500;cursor:pointer;margin-bottom:2px}
.side a.on{background:var(--ink);color:#fff}.side a:hover:not(.on){background:var(--bg)}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(241,246,244,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.bar h2{font-size:22px}.main{padding:24px;max-width:980px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--ln);background:var(--cd);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.k{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.s{height:32px;padding:0 10px;font-size:13px}.btn.d{color:var(--dn)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:16px}.card h3{font-size:18px;margin-bottom:4px}.mu{color:var(--mu);font-size:14px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:block;margin:10px 0}.f span{display:block;font-size:13px;color:var(--mu);margin-bottom:4px;font-weight:500}
.f input,.f select,.f textarea{width:100%;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg)}.f textarea{min-height:90px;resize:vertical}.f input[type=color]{padding:2px;height:42px}
.sw{display:flex;gap:10px;align-items:center;margin:10px 0;cursor:pointer}.sw input{display:none}.sw i{width:44px;height:25px;border-radius:99px;background:#B8C7C4;position:relative;transition:.2s;flex:none}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{left:22px}
.li{border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg)}.lh{display:flex;justify-content:space-between;align-items:center;gap:8px}.lh span{display:flex;gap:6px}
.im img{max-width:240px;max-height:160px;display:block;border-radius:10px;margin-bottom:8px;border:1px solid var(--ln)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--cd);cursor:pointer;font-weight:500}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat div{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px}.stat b{font-size:28px;display:block;font-family:'Bricolage Grotesque'}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}.bars i{flex:1;background:var(--ac);border-radius:5px 5px 0 0;min-height:3px;position:relative}.bars small{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mu)}
.rw{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}
.tl{border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--cd)}.tl.hid{opacity:.55}
#login{max-width:400px;margin:12vh auto;padding:0 16px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:50;display:none}
.pv{border-radius:20px;overflow:hidden;max-width:380px;border:3px solid var(--c);background:var(--cd);text-align:center;margin-top:10px}.pv img{width:100%;display:block}.pv div{padding:14px}.err{color:var(--dn);margin:8px 0}
@media(max-width:800px){.shell{display:block}.side{position:sticky;top:0;z-index:6;height:auto;display:flex;overflow-x:auto;padding:8px;gap:4px;border-right:0;border-bottom:1px solid var(--ln)}.side h1{display:none}.side a{white-space:nowrap;margin:0}.bar{top:50px;padding:10px 14px}.main{padding:14px}.gr{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="toast"></div>

const SBXA=SBX;
async function PRESAVE(c){ensureIds();c.blocks=JSON.parse(JSON.stringify(D.blocks||[]));
 const res=['home','tools','favs','recent','feedback'],ids=new Set(TOOLS.map(t=>t.id)),seen=new Set();(c.custom||[]).forEach(x=>x&&x.id&&ids.add(x.id));
 c.htool=(c.htool||[]).filter(x=>x&&(x.id||x.name));
 for(const x of c.htool){x.name=(x.name||'').trim();if(!x.name)throw new Error('Every code tool needs a name.');x.id=(x.id||'').trim()||('h-'+slug(x.name));if(!/^[a-z0-9-]+$/.test(x.id))throw new Error('Tool URL name “'+x.id+'” can use only small letters, numbers and hyphens.');if(res.includes(x.id)||ids.has(x.id)||seen.has(x.id))throw new Error('URL name “'+x.id+'” is already used. Pick another one.');seen.add(x.id);x.ts=x.ts||Date.now();if(x.hh==='auto')delete x.hh}
 c.catx=(c.catx||[]).filter(x=>x&&(x.id||x.n));const cs=new Set();for(const x of c.catx){x.id=(x.id||slug(x.n||'')).trim();if(!/^[a-z0-9-]+$/.test(x.id))throw new Error('Category ID “'+x.id+'” can use only small letters, numbers and hyphens.');if(cs.has(x.id))throw new Error('Category ID “'+x.id+'” is used twice.');cs.add(x.id)}
 try{for(const x of c.htool.filter(x=>CD.has(x.id)||!SV.has(x.id))){const code=CODE[x.id]??'';if(code.length>3.5e6)throw new Error('The code of “'+x.name+'” is too big (over 3.5 MB).');await api('PUT','code/'+encodeURIComponent(x.id),code)}
  for(const id of [...SV])if(!seen.has(id))await api('DELETE','code/'+encodeURIComponent(id))}
 catch(e){if(/Permission denied/.test(e.message))throw new Error('Tool code cannot be saved yet. Open the Advanced tab, copy the database rules and publish them once in Firebase, then press Save again.');throw e}
 SV=new Set(c.htool.map(x=>x.id));CD.clear()}
async function FILEH(t){if(t.id=='hnf'&&t.files[0]){const f=t.files[0],code=await f.text();await EXT('hnew',null,0);const x=D.htool[D.htool.length-1];x.name=f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').slice(0,60)||x.name;CODE[x.id]=code;CD.add(x.id);shell();return true}
 if(t.dataset.hf!=null&&t.files[0]){const x=D.htool[+t.dataset.hf];CODE[x.id]=await t.files[0].text();CD.add(x.id);mark();shell();toast('Code loaded. Press Save & publish.');return true}return false}
async function EXT(a,t,i){
 if(a=='hnew'){D.htool=D.htool||[];const used=new Set([...TOOLS.map(t=>t.id),...(D.custom||[]).map(x=>x.id),...D.htool.map(x=>x.id)]);let k=D.htool.length+1;while(used.has('my-tool-'+k))k++;const id='my-tool-'+k;D.htool.push({id,name:'My new tool',ic:'🧩',cat:'util',desc:'Describe what this tool does',type:'html'});CODE[id]=STARTER;CD.add(id);HO.add(id);mark();shell();return true}
 if(a=='hdup'){const x=D.htool[i],used=new Set([...TOOLS.map(t=>t.id),...(D.custom||[]).map(x=>x.id),...D.htool.map(x=>x.id)]);let id=x.id+'-copy',k=2;while(used.has(id))id=x.id+'-copy'+(k++);D.htool.splice(i+1,0,Object.assign({},x,{id,name:x.name+' copy',hidden:true,ts:Date.now()}));CODE[id]=CODE[x.id]||'';CD.add(id);HO.add(id);mark();shell();return true}
 if(a=='hdel'){const x=D.htool[i];if(!confirm('Delete “'+x.name+'” and its code? Press Save & publish afterwards to remove it from the site.'))return true;D.htool.splice(i,1);delete CODE[x.id];mark();shell();return true}
 if(a=='hprev'){const x=D.htool[i],h=$('#hp-'+i);if(!h)return true;if(h.firstChild){h.innerHTML='';return true}const f=document.createElement('iframe');f.setAttribute('sandbox',SBX);f.style.cssText='width:100%;height:560px;border:1px solid var(--ln);border-radius:12px;background:#fff;margin-top:10px';f.srcdoc=wrapDoc(CODE[x.id]||'');h.append(f);return true}
 if(a=='hfs'){const x=D.htool[i];window.open(URL.createObjectURL(new Blob([wrapDoc(CODE[x.id]||'')],{type:'text/html'})),'_blank');return true}
 if(a=='loadcats'){D.catx=Object.entries(CATS).map(([id,v])=>({id,n:v[0],c:v[1],i:v[2],d:v[3]}));mark();shell();return true}
 if(a=='sup'||a=='sdn'){const o=curOrder(),j=a=='sup'?i-1:i+1;if(j<0||j>=o.length)return true;[o[i],o[j]]=[o[j],o[i]];D.sec=o;mark();shell();return true}
 if(a=='sclr'){delete D.sec;mark();shell();return true}
 if(a=='defstrip'){D.stripx=[{v:'{tools}',l:'tools'},{v:'{cats}',l:'categories'},{v:'PNG · PDF',l:'downloads'},{v:'0',l:'sign-ups'}];mark();shell();return true}
 if(a=='defui'){if(confirm('Reset every design option on this page (colours of the main section stay)?')){delete D.ui;mark();shell()}return true}
 if(a=='heroclr'){if(D.ui){delete D.ui.heroBg1;delete D.ui.heroBg2;delete D.ui.heroImg;delete D.ui.heroFg}mark();shell();return true}
 if(a=='copyrules'){try{await navigator.clipboard.writeText(rulesText());toast('Rules copied')}catch(e){const r=$('#rl');if(r){r.select();toast('Select all and copy')}}return true}
 return false}
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.hid){d.open?HO.add(d.dataset.hid):HO.delete(d.dataset.hid)}},true);
const TABS=[['dash','📊','Dashboard'],['htools','➕','Add tool (code)'],['tools','🧰','Tools'],['custom','🧮','Simple tools'],['cats','🗂️','Categories'],['layout','🧱','Home layout'],['design','🎨','Theme & design'],['ads','💰','Ads'],['fest','🎉','Festival popup'],['ann','📣','Announcement'],['home','🏠','Hero & home'],['content','📝','FAQ & text'],['links','🏛️','Sarkari links'],['seo','🔎','SEO'],['foot','🔗','Footer & contact'],['fb','💬','Feedback'],['bg','✂️','BG Remover'],['ord','↕️','Tool order'],['code','💻','Code & ads'],['adv','⚙️','Advanced']];
function shell(){$('#app').innerHTML=`<div class="shell"><nav class="side"><h1>Qunverio</h1>${TABS.map(t=>`<a data-tab="${t[0]}" class="${tab==t[0]?'on':''}">${t[1]} ${t[2]}</a>`).join('')}</nav><div><div class="bar"><h2>${TABS.find(t=>t[0]==tab)[2]}</h2><span><span id="dirty" class="mu" hidden>Unsaved changes</span> <a class="btn" href="/" target="_blank">View site</a> <button class="btn p" data-act="save">Save & publish</button> <button class="btn" data-act="out">Log out</button></span></div><div class="main" id="main">${T_[tab]()}</div></div></div>`;if(dirty)$('#dirty').hidden=false}
async function go(t){tab=t;shell();if(t=='htools'){try{await loadCodes();if(tab==t)$('#main').innerHTML=T_.htools()}catch(e){toast(e.message)}return}if(t=='dash'||t=='fb'){try{if(t=='dash'||!ST)ST=await api('GET','stats');if(!FBK||t=='fb')FBK=await api('GET','feedback');if(tab==t)$('#main').innerHTML=T_[t]()}catch(e){toast(e.message)}}}
function loginUI(msg){$('#app').innerHTML=`<div id="login"><div class="card"><h2 style="font-size:28px">Qunverio Admin</h2>${!FB.db||!FB.key?`<p class="err">Setup needed: open <b>fb-config.js</b>, paste your Firebase database URL and Web API key, then upload it again.</p>`:`<label class="f"><span>Email</span><input id="em" type="email" autocomplete="username"></label><label class="f"><span>Password</span><input id="pw" type="password" autocomplete="current-password"></label><p class="err" id="le">${E(msg||'')}</p><button class="btn p" id="lb" style="width:100%">Log in</button>`}</div></div>`;const b=$('#lb');if(b){const f=async()=>{b.disabled=true;try{await login($('#em').value.trim(),$('#pw').value);await start()}catch(e){$('#le').textContent=e.message;b.disabled=false}};b.onclick=f;$('#pw').onkeydown=e=>e.key=='Enter'&&f()}}
async function start(){try{D=await pub('cfg');SV=new Set((D.htool||[]).map(x=>x&&x.id).filter(Boolean));D.fest=await pub('fest');delete D.festOn;delete D.festV;await go('dash')}catch(e){loginUI(e.message)}}
async function save(){try{const c=JSON.parse(JSON.stringify(D)),f=c.fest||{};delete c.fest;
 for(const x of (c.custom||[])){if(!x.id&&x.name)x.id='c-'+slug(x.name);if(x.id&&!/^[a-z0-9-]+$/.test(x.id))throw new Error('Tool URL name “'+x.id+'” can use only small letters, numbers and hyphens.');if(x.id&&['home','tools','favs','recent','feedback'].includes(x.id))throw new Error('“'+x.id+'” is reserved. Pick another URL name.')}
 await PRESAVE(c);const v=Date.now();c.festOn=!!f.on;c.festV=v;f.v=v;c.updated=v;await api('PUT','cfg',c);await api('PUT','fest',f);dirty=false;D.custom=c.custom;D.htool=c.htool;D.catx=c.catx;D.blocks=c.blocks;toast('Saved. The site is updated.');const d=$('#dirty');if(d)d.hidden=true}catch(e){toast(e.message)}}
const rs=f=>new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/webp',.82);if(!u.startsWith('data:image/webp'))u=c.toDataURL('image/jpeg',.8);r(u)};im.src=URL.createObjectURL(f)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.code!=null){const x=(D.htool||[])[+t.dataset.code];if(x){CODE[x.id]=t.value;CD.add(x.id);mark()}return}const mi=/^htool\.(\d+)\.id$/.exec(t.dataset.p||'');if(mi){const x=D.htool[+mi[1]],nv=t.value.trim();if(x&&x.id!==nv&&x.id in CODE){CODE[nv]=CODE[x.id];delete CODE[x.id];CD.add(nv)}}if(t.id=='tq'){const q=t.value.toLowerCase();document.querySelectorAll('.tl').forEach(x=>x.style.display=x.dataset.n.includes(q)?'':'none');return}const p=t.dataset.p;if(!p)return;sp(p,t.dataset.t=='b'?t.checked:t.dataset.t=='n'?+t.value:t.value);mark()});
document.addEventListener('change',async e=>{const t=e.target;if(await FILEH(t))return;if(t.dataset.img){const f=t.files[0];if(!f)return;sp(t.dataset.img,await rs(f));mark();shell()}
 if(t.dataset.act=='sec'){sp('hide.'+t.dataset.k,!t.checked);mark()}
 if(t.dataset.act=='pop'){const a=D.popular||[...DEFPOP],k=t.dataset.k,i=a.indexOf(k);if(t.checked&&i<0)a.push(k);if(!t.checked&&i>=0)a.splice(i,1);D.popular=a;mark()}
 if(t.id=='imp'&&t.files[0]){try{D=JSON.parse(await t.files[0].text());if(D._code){Object.keys(D._code).forEach(k=>{CODE[k]=D._code[k];CD.add(k)});delete D._code}mark();shell();toast('Backup loaded. Press Save to publish it.')}catch(x){toast('That file is not a valid backup')}}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab)return go(t.dataset.tab);const a=t.dataset.act,p=t.dataset.p,i=+t.dataset.i;
if(await EXT(a,t,i))return;

 if(a=='deford'){D.order=[...TOOLS.map(t=>t.id),...(D.custom||[]).map(t=>t.id).filter(Boolean),...(D.htool||[]).map(t=>t&&t.id).filter(Boolean)];mark();return shell()}

 if(a=='export'){await loadCodes();const b=new Blob([JSON.stringify(Object.assign({},D,{_code:CODE}),null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='qunverio-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click()}
 if(a=='reset'&&confirm('Remove every customisation and go back to defaults? Press Save afterwards to publish.')){D={};mark();shell()}});
